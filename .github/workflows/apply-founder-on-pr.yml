name: Apply founder update on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-founder-story
      - name: Run embedded founder update
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-founder-update.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == 'run: |') + 1
          end = next(i for i in range(start, len(source)) if source[i].startswith('      - name: Commit completed update'))
          script = textwrap.dedent('\n'.join(source[start:end]))
          script = script.replace('rm -f .github/workflows/apply-founder-update.yml', 'rm -f .github/workflows/apply-founder-update.yml .github/workflows/apply-founder-on-pr.yml')
          Path('/tmp/apply-founder.sh').write_text(script)
          PY
          bash /tmp/apply-founder.sh
