name: Apply founder update

on:
  push:
    branches:
      - update-founder-story

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-founder-story
      - name: Update founder section and image
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import base64

          path = Path('index.html')
          text = path.read_text()

          old_css = '''    .founder-panel {
            display: grid;
            grid-template-columns: 0.7fr 1.3fr;
            gap: 4rem;
            padding: 3rem;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--aviation-orange);
            border-radius: 6px;
            background: var(--light-gray);
          }

          .founder-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          }

          .founder-copy h2 {
            margin-bottom: 1.2rem;
          }

          .founder-meta {
            justify-content: flex-start;
            flex-wrap: wrap;
            margin-top: 1.5rem;
          }

          .founder-meta span {
            padding: 0.35rem 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background: #fff;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
          }
'''

          new_css = '''    .founder-panel {
            display: grid;
            grid-template-columns: minmax(210px, 280px) minmax(0, 1fr);
            gap: 3.5rem;
            align-items: center;
            padding: 3rem;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--aviation-orange);
            border-radius: 6px;
            background: var(--light-gray);
          }

          .founder-photo {
            position: relative;
          }

          .founder-photo::after {
            content: '';
            position: absolute;
            inset: 12px -12px -12px 12px;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            z-index: 0;
          }

          .founder-photo img {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 7px;
            filter: saturate(0.92) contrast(1.02);
          }

          .founder-label {
            margin-bottom: 0.9rem;
            color: var(--aviation-orange);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          }

          .founder-copy h2 {
            margin-bottom: 1.25rem;
          }

          .founder-quote {
            position: relative;
            margin: 0 0 1.35rem;
            padding-left: 1.25rem;
            border-left: 2px solid var(--aviation-orange);
            color: var(--tarmac);
            font-size: 1.08rem;
            font-weight: 600;
            line-height: 1.65;
          }

          .founder-story {
            max-width: 680px;
            line-height: 1.7;
          }

          .founder-signature {
            margin-top: 1.5rem;
            padding-top: 1.15rem;
            border-top: 1px solid var(--border-color);
          }

          .founder-signature strong,
          .founder-signature span {
            display: block;
          }

          .founder-signature strong {
            font-size: 0.95rem;
          }

          .founder-signature span {
            margin-top: 0.2rem;
            color: var(--asphalt-gray);
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
          }
'''

          old_html = '''<section class="founder-section">
          <div class="founder-panel">
          <div class="founder-label">Built from inside the airport industry</div>
          <div class="founder-copy">
          <h2>Built by an airport executive who knows the work.</h2>
          <p>TarmacSync is shaped by more than a decade of firsthand experience across U.S. commercial airport management, operations, procurement, grants, contracts, capital projects, security, and maintenance.</p>
          <div class="founder-meta">
          <span>AAAE Accredited Airport Executive (A.A.E.)</span>
          </div>
          </div>
          </div>
          </section>'''

          new_html = '''<section class="founder-section">
          <div class="founder-panel">
          <div class="founder-photo">
          <img src="omar-daaboul-founder.jpg" alt="Omar Daaboul, A.A.E., founder of TarmacSync" width="240" height="240" loading="lazy">
          </div>
          <div class="founder-copy">
          <div class="founder-label">Built from inside the airport industry</div>
          <h2>Built by someone who has done the work.</h2>
          <blockquote class="founder-quote">“After years of working inside U.S. airports, I kept seeing the same problem: buying the right thing wasn’t the hard part—figuring out the clearest way to buy it was.”</blockquote>
          <p class="founder-story">I’ve spent more than a decade working across airport management, operations, procurement, contracts, grants, capital projects, security, and maintenance. I built TarmacSync because airport teams deserve a clearer way to evaluate their options before the procurement process begins.</p>
          <div class="founder-signature">
          <strong>Omar Daaboul, A.A.E.</strong>
          <span>Founder, TarmacSync</span>
          </div>
          </div>
          </div>
          </section>'''

          if old_css not in text:
              raise SystemExit('Expected founder CSS block was not found.')
          if old_html not in text:
              raise SystemExit('Expected founder HTML block was not found.')

          text = text.replace(old_css, new_css, 1).replace(old_html, new_html, 1)
          path.write_text(text)

          image_b64 = ''
          Path('omar-daaboul-founder.jpg').write_bytes(base64.b64decode(image_b64))
          PY
      - name: Commit completed update
        shell: bash
        run: |
          rm -f .github/workflows/apply-founder-update.yml
          git config user.name "TarmacSync Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html omar-daaboul-founder.jpg .github/workflows/apply-founder-update.yml
          git commit -m "Add founder photo and personal story"
          git push origin update-founder-story
