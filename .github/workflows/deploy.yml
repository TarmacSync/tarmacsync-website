# Publishes the site to Cloudflare Pages. A push to main goes to production
# (www.tarmacsync.com); a pull request gets a preview URL. The Node checks run first,
# so a change that breaks them is never published.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site checks
        run: |
          node scripts/site-check.cjs
          node scripts/functions-check.mjs
          node scripts/copy-check.cjs
      - name: Build
        run: node scripts/build-pages.cjs
      - name: Deploy
        # Pull requests from forks get no secrets; skip rather than fail.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.152.0 pages deploy dist
          --project-name tarmacsync-website
          --branch "${{ github.head_ref || github.ref_name }}"
          --commit-hash "${{ github.sha }}"
