<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title description">
  <title id="title">TarmacSync airport procurement intelligence</title>
  <desc id="description">Airport-specific project, funding, policy, contract, and regulatory context flows through TarmacSync. The team sees a working procurement path, why it appears to fit, what needs validation, and the next move. Existing airport systems continue to execute and record the work.</desc>

  <defs>
    <style>
      .sans { font-family: Inter, Aptos, Arial, Helvetica, sans-serif; }
      .label { font-size: 13px; font-weight: 600; letter-spacing: 2.2px; }
      .eyebrow { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
      .heading { font-size: 36px; font-weight: 600; letter-spacing: -1.1px; }
      .brand { font-size: 52px; font-weight: 600; letter-spacing: -1.8px; }
      .body { font-size: 19px; font-weight: 400; letter-spacing: -.15px; }
      .item { font-size: 20px; font-weight: 500; letter-spacing: -.25px; }
      .small { font-size: 16px; font-weight: 400; }
      .systems { font-size: 13px; font-weight: 600; letter-spacing: 1.35px; }
    </style>
  </defs>

  <rect width="1600" height="840" fill="#FFFFFF"/>

  <g class="sans">
    <text x="96" y="80" class="label" fill="#6F737C">ONE DECISION. ALL THE CONTEXT THAT CHANGES THE ANSWER.</text>
    <line x1="96" y1="108" x2="1504" y2="108" stroke="#E7E9ED"/>

    <!-- 01: airport context -->
    <g>
      <text x="96" y="164" class="label" fill="#6F737C">01  AIRPORT CONTEXT</text>
      <text x="96" y="218" class="heading" fill="#17191F">What shapes the decision</text>

      <g class="item" fill="#17191F">
        <circle cx="103" cy="292" r="3.5" fill="#F56A00"/>
        <text x="124" y="299">Project need + expected value</text>
        <circle cx="103" cy="346" r="3.5" fill="#F56A00"/>
        <text x="124" y="353">Funding source</text>
        <circle cx="103" cy="400" r="3.5" fill="#F56A00"/>
        <text x="124" y="407">Local policy + approvals</text>
        <circle cx="103" cy="454" r="3.5" fill="#F56A00"/>
        <text x="124" y="461">Contracts + cooperative pathways</text>
        <circle cx="103" cy="508" r="3.5" fill="#F56A00"/>
        <text x="124" y="515">Federal + state requirements</text>
      </g>

      <text x="96" y="574" class="small" fill="#6F737C">Airport-specific facts, not generic procurement advice.</text>
    </g>

    <line x1="464" y1="392" x2="532" y2="392" stroke="#B9BDC7" stroke-width="1.5"/>
    <circle cx="464" cy="392" r="3" fill="#F56A00"/>
    <path d="M523 386 L532 392 L523 398" fill="none" stroke="#F56A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 02: TarmacSync intelligence layer -->
    <g>
      <rect x="552" y="150" width="496" height="456" rx="24" fill="#17191F"/>
      <rect x="584" y="184" width="30" height="3" rx="1.5" fill="#F56A00"/>
      <text x="584" y="222" class="label" fill="#B9BDC7">02  INTELLIGENCE LAYER</text>
      <text x="584" y="300" class="brand" fill="#FFFFFF">TarmacSync</text>
      <text x="584" y="339" class="eyebrow" fill="#F56A00">Airport procurement intelligence</text>

      <line x1="584" y1="380" x2="1016" y2="380" stroke="#353840"/>

      <text x="584" y="425" class="body" fill="#FFFFFF">Brings the context together</text>
      <text x="584" y="454" class="body" fill="#FFFFFF">before procurement starts.</text>

      <text x="584" y="512" class="small" fill="#B9BDC7">Evaluate viable routes</text>
      <circle cx="759" cy="507" r="2" fill="#F56A00"/>
      <text x="775" y="512" class="small" fill="#B9BDC7">Surface requirements</text>
      <text x="584" y="548" class="small" fill="#B9BDC7">Connect sources, reasoning + next steps</text>
    </g>

    <line x1="1068" y1="392" x2="1136" y2="392" stroke="#B9BDC7" stroke-width="1.5"/>
    <circle cx="1068" cy="392" r="3" fill="#F56A00"/>
    <path d="M1127 386 L1136 392 L1127 398" fill="none" stroke="#F56A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 03: decision support -->
    <g>
      <text x="1156" y="164" class="label" fill="#6F737C">03  DECISION SUPPORT</text>
      <text x="1156" y="218" class="heading" fill="#17191F">A working path</text>
      <text x="1156" y="253" class="body" fill="#3E4149">Likely route, with viable alternatives.</text>

      <line x1="1156" y1="292" x2="1504" y2="292" stroke="#E7E9ED"/>
      <text x="1156" y="333" class="label" fill="#6F737C">WHY IT FITS</text>
      <text x="1156" y="368" class="body" fill="#17191F">Sources + reasoning</text>

      <line x1="1156" y1="402" x2="1504" y2="402" stroke="#E7E9ED"/>
      <text x="1156" y="443" class="label" fill="#6F737C">WHAT TO CONFIRM</text>
      <text x="1156" y="478" class="body" fill="#17191F">Requirements to validate</text>

      <line x1="1156" y1="512" x2="1504" y2="512" stroke="#E7E9ED"/>
      <text x="1156" y="553" class="label" fill="#B94E08">NEXT MOVE</text>
      <text x="1156" y="588" class="body" fill="#17191F">Action that keeps the project moving</text>
    </g>

    <line x1="96" y1="676" x2="1504" y2="676" stroke="#E7E9ED"/>
    <text x="96" y="724" class="label" fill="#6F737C">YOUR EXISTING SYSTEMS CARRY IT FORWARD</text>
    <text x="96" y="758" class="small" fill="#3E4149">TarmacSync adds intelligence without replacing the systems you already use.</text>
    <text x="1504" y="741" text-anchor="end" class="systems" fill="#3E4149">ERP <tspan fill="#B9BDC7">·</tspan> ePROCUREMENT <tspan fill="#B9BDC7">·</tspan> CONTRACTS <tspan fill="#B9BDC7">·</tspan> RECORDS</text>
  </g>
</svg>
