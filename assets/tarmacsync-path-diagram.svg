<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">How TarmacSync connects airport procurement context to a working path</title>
  <desc id="description">Procurement policy, funding terms, project facts, contract options, and institutional knowledge flow through TarmacSync. The airport team sees the route that appears to fit, what still needs validation, and the next move. Existing systems carry the work forward.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .kicker { font-size: 14px; font-weight: 700; letter-spacing: 2.1px; }
      .intro { font-size: 18px; font-weight: 450; }
      .item { font-size: 22px; font-weight: 560; letter-spacing: -0.2px; }
      .brand { font-size: 50px; font-weight: 650; letter-spacing: -2px; }
      .center-copy { font-size: 20px; font-weight: 450; }
      .output-title { font-size: 38px; font-weight: 650; letter-spacing: -1.2px; }
      .output-value { font-size: 20px; font-weight: 540; letter-spacing: -0.15px; }
      .system { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; }
    </style>
  </defs>

  <!-- One quiet product canvas. The information hierarchy does the work. -->
  <rect x="60" y="80" width="1480" height="600" rx="28" fill="#FFFFFF" stroke="#E4E6EA"/>
  <line x1="540" y1="132" x2="540" y2="536" stroke="#E4E6EA"/>
  <line x1="990" y1="132" x2="990" y2="536" stroke="#E4E6EA"/>
  <line x1="108" y1="556" x2="1492" y2="556" stroke="#E4E6EA"/>

  <g class="sans">
    <!-- Scattered context -->
    <text x="108" y="150" class="mono kicker" fill="#6E7179">SCATTERED TODAY</text>
    <text x="108" y="188" class="intro" fill="#6E7179">The pieces already exist across the airport.</text>

    <g fill="#17191F" class="item">
      <circle cx="115" cy="252" r="3.5" fill="#F56A00"/>
      <text x="134" y="259">Procurement policy</text>
      <circle cx="115" cy="302" r="3.5" fill="#F56A00"/>
      <text x="134" y="309">Funding terms</text>
      <circle cx="115" cy="352" r="3.5" fill="#F56A00"/>
      <text x="134" y="359">Project facts</text>
      <circle cx="115" cy="402" r="3.5" fill="#F56A00"/>
      <text x="134" y="409">Contract options</text>
      <circle cx="115" cy="452" r="3.5" fill="#F56A00"/>
      <text x="134" y="459">Institutional knowledge</text>
    </g>

    <!-- TarmacSync intelligence layer -->
    <text x="596" y="150" class="mono kicker" fill="#B94E08">AIRPORT PROCUREMENT INTELLIGENCE</text>
    <text x="596" y="247" class="brand" fill="#17191F">Tarmac<tspan fill="#6E7179" font-weight="450">Sync</tspan></text>
    <text x="596" y="291" class="center-copy" fill="#3E4149">Connects the project context.</text>

    <!-- One restrained route line is the only decorative device. -->
    <path d="M596 365 H684 C707 365 707 345 730 345 H825 C849 345 849 365 873 365 H930" fill="none" stroke="#F56A00" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="596" cy="365" r="4" fill="#F56A00"/>
    <circle cx="730" cy="345" r="4.5" fill="#FFFFFF" stroke="#F56A00" stroke-width="2"/>
    <circle cx="873" cy="365" r="4.5" fill="#FFFFFF" stroke="#F56A00" stroke-width="2"/>
    <path d="M922 359 L931 365 L922 371" fill="none" stroke="#F56A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- What the team sees -->
    <text x="1046" y="150" class="mono kicker" fill="#6E7179">WHAT THE TEAM SEES</text>
    <text x="1046" y="216" class="output-title" fill="#17191F">A working path</text>
    <text x="1046" y="254" class="output-value" fill="#3E4149">The route that appears to fit</text>

    <line x1="1046" y1="286" x2="1492" y2="286" stroke="#E4E6EA"/>
    <text x="1046" y="326" class="mono kicker" fill="#6E7179">OPEN ISSUE</text>
    <text x="1046" y="364" class="output-value" fill="#17191F">What still needs validation</text>

    <line x1="1046" y1="396" x2="1492" y2="396" stroke="#E4E6EA"/>
    <text x="1046" y="436" class="mono kicker" fill="#B94E08">NEXT MOVE</text>
    <text x="1046" y="474" class="output-value" fill="#17191F">The action that moves it forward</text>

    <!-- Quiet directional cues across the column boundaries. -->
    <circle cx="540" cy="352" r="4" fill="#F56A00"/>
    <path d="M552 346 L560 352 L552 358" fill="none" stroke="#F56A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="990" cy="352" r="4" fill="#F56A00"/>
    <path d="M1002 346 L1010 352 L1002 358" fill="none" stroke="#F56A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Existing systems remain the execution layer. -->
    <text x="108" y="623" class="mono kicker" fill="#6E7179">YOUR SYSTEMS CARRY IT FORWARD</text>
    <text x="1492" y="623" text-anchor="end" class="mono system" fill="#3E4149">ERP <tspan fill="#B9BDC7">·</tspan> ePROCUREMENT <tspan fill="#B9BDC7">·</tspan> RECORDS</text>
  </g>
</svg>
