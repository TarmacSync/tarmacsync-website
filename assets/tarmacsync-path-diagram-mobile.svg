<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1460" viewBox="0 0 760 1460" role="img" aria-labelledby="title description">
  <title id="title">How TarmacSync connects airport procurement context to a working path</title>
  <desc id="description">Procurement policy, funding terms, project facts, contract options, and institutional knowledge flow through TarmacSync. The airport team sees the route that appears to fit, what still needs validation, and the next move. Existing systems carry the work forward.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .kicker { font-size: 23px; font-weight: 700; letter-spacing: 2.6px; }
      .intro { font-size: 27px; font-weight: 450; }
      .item { font-size: 32px; font-weight: 560; letter-spacing: -0.25px; }
      .brand { font-size: 54px; font-weight: 650; letter-spacing: -2px; }
      .center-copy { font-size: 29px; font-weight: 450; }
      .output-title { font-size: 45px; font-weight: 650; letter-spacing: -1.1px; }
      .output-value { font-size: 29px; font-weight: 540; letter-spacing: -0.1px; }
      .system { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect x="54" y="48" width="652" height="1364" rx="28" fill="#FFFFFF" stroke="#E4E6EA"/>
  <line x1="90" y1="530" x2="670" y2="530" stroke="#E4E6EA"/>
  <line x1="90" y1="856" x2="670" y2="856" stroke="#E4E6EA"/>
  <line x1="90" y1="1288" x2="670" y2="1288" stroke="#E4E6EA"/>

  <g class="sans">
    <!-- Scattered context -->
    <text x="90" y="108" class="mono kicker" fill="#6E7179">SCATTERED TODAY</text>
    <text x="90" y="157" class="intro" fill="#6E7179">The pieces already exist across the airport.</text>
    <g fill="#17191F" class="item">
      <circle cx="99" cy="226" r="4" fill="#F56A00"/><text x="126" y="236">Procurement policy</text>
      <circle cx="99" cy="286" r="4" fill="#F56A00"/><text x="126" y="296">Funding terms</text>
      <circle cx="99" cy="346" r="4" fill="#F56A00"/><text x="126" y="356">Project facts</text>
      <circle cx="99" cy="406" r="4" fill="#F56A00"/><text x="126" y="416">Contract options</text>
      <circle cx="99" cy="466" r="4" fill="#F56A00"/><text x="126" y="476">Institutional knowledge</text>
    </g>

    <path d="M371 518 L380 526 L389 518" fill="none" stroke="#F56A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- TarmacSync intelligence layer -->
    <text x="90" y="602" class="mono kicker" fill="#B94E08">AIRPORT PROCUREMENT INTELLIGENCE</text>
    <text x="90" y="689" class="brand" fill="#17191F">Tarmac<tspan fill="#6E7179" font-weight="450">Sync</tspan></text>
    <text x="90" y="739" class="center-copy" fill="#3E4149">Connects the project context.</text>
    <path d="M90 798 H218 C244 798 244 778 270 778 H445 C471 778 471 798 497 798 H651" fill="none" stroke="#F56A00" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="798" r="5" fill="#F56A00"/>
    <circle cx="270" cy="778" r="5" fill="#FFFFFF" stroke="#F56A00" stroke-width="2.5"/>
    <circle cx="497" cy="798" r="5" fill="#FFFFFF" stroke="#F56A00" stroke-width="2.5"/>
    <path d="M642 792 L652 798 L642 804" fill="none" stroke="#F56A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M371 844 L380 852 L389 844" fill="none" stroke="#F56A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- What the team sees -->
    <text x="90" y="928" class="mono kicker" fill="#6E7179">WHAT THE TEAM SEES</text>
    <text x="90" y="1002" class="output-title" fill="#17191F">A working path</text>
    <text x="90" y="1050" class="output-value" fill="#3E4149">The route that appears to fit</text>

    <line x1="90" y1="1080" x2="670" y2="1080" stroke="#E4E6EA"/>
    <text x="90" y="1122" class="mono kicker" fill="#6E7179">OPEN ISSUE</text>
    <text x="90" y="1165" class="output-value" fill="#17191F">What still needs validation</text>

    <line x1="90" y1="1196" x2="670" y2="1196" stroke="#E4E6EA"/>
    <text x="90" y="1238" class="mono kicker" fill="#B94E08">NEXT MOVE</text>
    <text x="90" y="1280" class="output-value" fill="#17191F">The action that moves it forward</text>

    <!-- Existing systems remain the execution layer. -->
    <text x="90" y="1335" class="mono kicker" fill="#6E7179">YOUR SYSTEMS CARRY IT FORWARD</text>
    <text x="90" y="1382" class="mono system" fill="#3E4149">ERP <tspan fill="#B9BDC7">·</tspan> ePROCUREMENT <tspan fill="#B9BDC7">·</tspan> RECORDS</text>
  </g>
</svg>
