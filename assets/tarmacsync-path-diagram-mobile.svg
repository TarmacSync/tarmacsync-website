<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1680" viewBox="0 0 760 1680" role="img" aria-labelledby="title description">
  <title id="title">Airport context becomes a working procurement path through TarmacSync</title>
  <desc id="description">Project, funding, policy, contract, and regulatory context flows through TarmacSync. The airport team sees the likely route, the open issue, and the next move. Existing airport systems carry the work forward.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, Aptos, Arial, Helvetica, sans-serif; }
      .label { font-size: 23px; font-weight: 500; letter-spacing: 2.4px; }
      .heading { font-family: "Aptos Display", Aptos, Inter, Arial, sans-serif; font-size: 45px; font-weight: 500; letter-spacing: -1.1px; }
      .item { font-size: 33px; font-weight: 400; letter-spacing: -.2px; }
      .brand { font-family: "Aptos Display", Aptos, Inter, Arial, sans-serif; font-size: 58px; font-weight: 500; letter-spacing: -1.8px; }
      .accent { font-size: 25px; font-weight: 400; }
      .center-copy { font-family: "Aptos Display", Aptos, Inter, Arial, sans-serif; font-size: 32px; font-weight: 400; letter-spacing: -.2px; }
      .center-emphasis { font-weight: 500; }
      .output { font-size: 31px; font-weight: 400; letter-spacing: -.2px; }
      .systems { font-size: 20px; font-weight: 500; letter-spacing: 1px; }
      .flow-arrow { fill: none; stroke: #F56A00; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="760" height="1680" fill="#FFFFFF"/>

  <g class="sans">
    <text x="64" y="78" class="label" fill="#6F737C">01  AIRPORT CONTEXT</text>
    <text x="64" y="150" class="heading" fill="#17191F">What shapes the decision</text>
    <g class="item" fill="#17191F">
      <circle cx="74" cy="228" r="4.5" fill="#F56A00"/><text x="104" y="239">Project + expected value</text>
      <circle cx="74" cy="290" r="4.5" fill="#F56A00"/><text x="104" y="301">Funding</text>
      <circle cx="74" cy="352" r="4.5" fill="#F56A00"/><text x="104" y="363">Policy + approvals</text>
      <circle cx="74" cy="414" r="4.5" fill="#F56A00"/><text x="104" y="425">Contract options</text>
      <circle cx="74" cy="476" r="4.5" fill="#F56A00"/><text x="104" y="487">Federal + state rules</text>
    </g>

    <line x1="64" y1="536" x2="696" y2="536" stroke="#E7E9ED"/>
    <path class="flow-arrow" d="M364 548 L380 564 L396 548"/>

    <rect x="64" y="590" width="632" height="430" rx="26" fill="#17191F"/>
    <rect x="104" y="630" width="36" height="4" rx="2" fill="#F56A00"/>
    <text x="104" y="681" class="label" fill="#B9BDC7">02  INTELLIGENCE</text>
    <text x="104" y="764" class="brand" fill="#FFFFFF">TarmacSync</text>
    <text x="104" y="808" class="accent" fill="#F56A00">Airport procurement intelligence</text>
    <line x1="104" y1="844" x2="656" y2="844" stroke="#353840"/>
    <text x="104" y="898" class="center-copy" fill="#FFFFFF">Turns airport context into</text>
    <text x="104" y="940" class="center-copy center-emphasis" fill="#FFFFFF">a working path.</text>

    <path class="flow-arrow" d="M364 1038 L380 1054 L396 1038"/>

    <text x="64" y="1102" class="label" fill="#6F737C">03  WORKING PATH</text>
    <text x="64" y="1170" class="heading" fill="#17191F">What the team sees</text>

    <text x="64" y="1234" class="label" fill="#6F737C">LIKELY ROUTE</text>
    <text x="64" y="1277" class="output" fill="#17191F">What appears to fit</text>
    <line x1="64" y1="1306" x2="696" y2="1306" stroke="#E7E9ED"/>

    <text x="64" y="1348" class="label" fill="#6F737C">OPEN ISSUE</text>
    <text x="64" y="1391" class="output" fill="#17191F">What needs validation</text>
    <line x1="64" y1="1420" x2="696" y2="1420" stroke="#E7E9ED"/>

    <text x="64" y="1462" class="label" fill="#B94E08">NEXT MOVE</text>
    <text x="64" y="1505" class="output" fill="#17191F">What moves it forward</text>

    <line x1="64" y1="1544" x2="696" y2="1544" stroke="#E7E9ED"/>
    <text x="64" y="1594" class="label" fill="#6F737C">YOUR SYSTEMS CARRY IT FORWARD</text>
    <text x="64" y="1644" class="systems" fill="#3E4149">ERP <tspan fill="#B9BDC7">·</tspan> ePROCUREMENT <tspan fill="#B9BDC7">·</tspan> RECORDS</text>
  </g>
</svg>
